<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interaktive Chemiestunden</title>
<meta name="description" content="Interaktive Präsentationen für den Chemieunterricht der Klassen 8 bis 10.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#F2F5F9; --surface:#FFFFFF; --surface-2:#E6EBF2; --ink:#121D2B; --ink-2:#4B5A6D; --line:#CBD4E0;
  --accent:#2453C4; --accent-ink:#FFFFFF;
  --g8:#2E8B1E; --g9:#2453C4; --g10:#B8560B;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --radius:14px;
  font-size:clamp(16px, 0.5vw + 12px, 20px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D131B; --surface:#151D28; --surface-2:#1E2836; --ink:#E8EDF4; --ink-2:#A2AEBE; --line:#2C394A;
    --accent:#7AA2FF; --accent-ink:#0D131B;
    --g8:#5FCB58; --g9:#7AA2FF; --g10:#F0A050;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D131B; --surface:#151D28; --surface-2:#1E2836; --ink:#E8EDF4; --ink-2:#A2AEBE; --line:#2C394A;
  --accent:#7AA2FF; --accent-ink:#0D131B;
  --g8:#5FCB58; --g9:#7AA2FF; --g10:#F0A050;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.5}
main{max-width:1040px;margin:0 auto;padding:clamp(28px,6vw,64px) 16px 72px}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);margin:0 0 .6em}
h1{font-family:var(--f-display);font-weight:800;font-stretch:118%;font-size:clamp(2.1rem,6vw,3.6rem);line-height:1.02;margin:0 0 .35em}
.lead{color:var(--ink-2);margin:0;max-width:58ch}

.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:2.4em 0 1.2em;font-family:var(--f-mono);font-size:.85rem}
.crumbs button{font:inherit;color:var(--accent);background:none;border:0;padding:4px 6px;border-radius:6px;cursor:pointer}
.crumbs button:hover{background:var(--surface-2)}
.crumbs span[aria-current]{color:var(--ink);padding:4px 6px}
.crumbs .sep{color:var(--ink-2)}

h2{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin:0 0 .8em}

.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grade{--c:var(--accent);font:inherit;color:inherit;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px 18px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden;transition:border-color .15s,transform .15s}
.grade::before{content:"";position:absolute;inset:0 auto 0 0;width:6px;background:var(--c)}
.grade .num{font-family:var(--f-display);font-weight:800;font-stretch:125%;font-size:clamp(2.6rem,9vw,4.2rem);line-height:1;color:var(--c)}
.grade .lbl{font-weight:700}
.grade .meta{color:var(--ink-2);font-size:.88rem}
.grade[data-g="8"]{--c:var(--g8)} .grade[data-g="9"]{--c:var(--g9)} .grade[data-g="10"]{--c:var(--g10)}

.topics{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.topic{font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%;height:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.topic .t{font-family:var(--f-display);font-weight:700;font-size:1.1rem;line-height:1.2}
.topic .d{color:var(--ink-2);font-size:.88rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.topic .n{margin-top:auto;padding-top:6px;font-family:var(--f-mono);font-size:.78rem;color:var(--ink-2)}

.grade:hover,.grade:focus-visible,.topic:hover,.topic:focus-visible,.lesson a:hover,.lesson a:focus-visible{border-color:var(--accent);transform:translateY(-2px);outline:none}

.topic-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:1.2em}
.topic-head h2{margin:0;font-size:clamp(1.5rem,4vw,2.1rem);font-stretch:110%;line-height:1.1}
.topic-head p{color:var(--ink-2);margin:.4em 0 0;max-width:60ch}
.btn{display:inline-block;font-weight:700;text-decoration:none;color:var(--accent-ink);background:var(--accent);padding:10px 18px;border-radius:999px;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.lessons{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.lesson a{display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;transition:border-color .15s,transform .15s}
.lesson .no{font-family:var(--f-mono);font-weight:600;font-size:.85rem;color:var(--accent);min-width:2.2em}
.lesson .lt{font-weight:700;flex:1}
.lesson .go{color:var(--ink-2)}

footer{margin-top:4em;color:var(--ink-2);font-size:.82rem}
[hidden]{display:none!important}
@media (max-width:560px){.grades{grid-template-columns:1fr}.grade{flex-direction:row;align-items:center;gap:16px}.grade .num{min-width:1.6em}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Chemie · Klassen 8–10</p>
  <h1>Interaktive Chemie&shy;stunden</h1>
  <p class="lead">Wähle zuerst die Klassenstufe, dann das Thema. Alle Stunden laufen direkt im Browser.</p>

  <nav class="crumbs" aria-label="Navigation" id="crumbs"></nav>

  <section id="v-grade" aria-labelledby="h-grade">
    <h2 id="h-grade">Klassenstufe wählen</h2>
    <div class="grades" id="grades"></div>
  </section>

  <section id="v-topic" aria-labelledby="h-topic" hidden>
    <h2 id="h-topic"></h2>
    <ul class="topics" id="topics"></ul>
  </section>

  <section id="v-lessons" aria-labelledby="h-lessons" hidden>
    <div class="topic-head">
      <div><h2 id="h-lessons"></h2><p id="lessons-lead"></p></div>
      <a class="btn" id="overview-link" href="#">Zur Übersicht der Reihe →</a>
    </div>
    <ol class="lessons" id="lessons"></ol>
  </section>

  <footer>Interaktive Chemiestunden · freie Unterrichtsmaterialien</footer>
</main>
<script>
const TOPICS = [{"id": "8-Chemische_Reaktion", "grade": 8, "title": "Die chemische Reaktion", "lead": "Wann entsteht ein neuer Stoff? Die Reihe klärt die Kennzeichen chemischer Reaktionen, unterscheidet Elemente und Verbindungen, untersucht Verbrennungen und Oxidationen, führt über das Gesetz von der Erhaltung der Masse zum Atommodell von Dalton und endet mit Reaktionsschemata und dem Energieumsatz.", "lessons": [{"file": "01_Neue_Stoffe.html", "title": "Neue Stoffe entstehen"}, {"file": "02_Elemente_Verbindungen.html", "title": "Elemente und Verbindungen"}, {"file": "03_Verbrennung.html", "title": "Verbrennung und Oxidation"}, {"file": "04_Masse_Atome.html", "title": "Masse bleibt – Atome ordnen sich neu"}, {"file": "05_Formeln_Gleichungen.html", "title": "Formeln und Reaktionsgleichungen"}, {"file": "06_Energie.html", "title": "Chemische Reaktion und Energie"}, {"file": "07_Wiederholung.html", "title": "Wiederholung und Selbsttest"}]}, {"id": "8-Luft", "grade": 8, "title": "Luft", "lead": "Woraus besteht Luft und wie kann man das messen? Die Reihe untersucht die Zusammensetzung der Luft, die Eigenschaften und Nachweise von Sauerstoff, Stickstoff und Kohlenstoffdioxid, den Kreislauf von Fotosynthese und Atmung, Luftschadstoffe und den Treibhauseffekt.", "lessons": [{"file": "01_Zusammensetzung.html", "title": "Die Zusammensetzung der Luft"}, {"file": "02_Gase_der_Luft.html", "title": "Sauerstoff, Stickstoff und Co."}, {"file": "03_Luftverschmutzung.html", "title": "Luftverschmutzung"}, {"file": "04_Treibhauseffekt.html", "title": "Der Treibhauseffekt"}, {"file": "05_Wiederholung.html", "title": "Wiederholung und Selbsttest"}]}, {"id": "8-Metalle_Redox", "grade": 8, "title": "Metalle und Redoxreaktionen", "lead": "Die Reihe startet bei den typischen Eigenschaften der Metalle, vergleicht ihre Reaktion mit Sauerstoff und führt zur Reduktion und Redoxreaktion. Anwendungen sind das Thermitverfahren, die Gewinnung von Kupfer und Eisen im Hochofen, Stahl, Korrosion und Recycling.", "lessons": [{"file": "01_Metalle.html", "title": "Metalle und ihre Eigenschaften"}, {"file": "02_Oxidationsreihe.html", "title": "Metalle reagieren unterschiedlich"}, {"file": "03_Redoxreaktion.html", "title": "Reduktion und Redoxreaktion"}, {"file": "04_Hochofen.html", "title": "Vom Erz zum Stahl"}, {"file": "05_Korrosion_Recycling.html", "title": "Korrosionsschutz und Recycling"}, {"file": "06_Wiederholung.html", "title": "Wiederholung und Selbsttest"}]}, {"id": "8-Stoffe", "grade": 8, "title": "Stoffe im Alltag", "lead": "Die Reihe führt von der Unterscheidung zwischen Gegenstand und Stoff über Stoffeigenschaften und das Teilchenmodell zu Aggregatzuständen, Gemischen und Trennverfahren. Jede Stunde ist eine eigene Präsentation für Beamer oder Smartboard mit Simulationen, Hefteintrag und Übungen zum Selbstkontrollieren.", "lessons": [{"file": "01_Stoffeigenschaften.html", "title": "Stoffe und ihre Eigenschaften"}, {"file": "02_Teilchenmodell.html", "title": "Stoffe bestehen aus Teilchen"}, {"file": "03_Aggregatzustaende.html", "title": "Aggregatzustände im Teilchenmodell"}, {"file": "04_Gemische.html", "title": "Reinstoffe und Gemische"}, {"file": "05_Trennverfahren.html", "title": "Trennverfahren für Stoffgemische"}, {"file": "06_Wiederholung.html", "title": "Wiederholung und Selbsttest"}]}, {"id": "8-Wasser", "grade": 8, "title": "Wasser", "lead": "Wasser ist überall, aber alles andere als gewöhnlich. Die Reihe untersucht Eigenschaften und Qualität von Wasser, die Anomalie des Wassers, die Zerlegung durch elektrischen Strom und die Bildung aus Wasserstoff und Sauerstoff, den Wasserstoff als Energieträger und Katalysatoren.", "lessons": [{"file": "01_Wasser_Eigenschaften.html", "title": "Wasser – ein vielseitiger Stoff"}, {"file": "02_Anomalie.html", "title": "Die Anomalie des Wassers"}, {"file": "03_Zerlegung_Bildung.html", "title": "Zerlegung und Bildung von Wasser"}, {"file": "04_Wasserstoff.html", "title": "Wasserstoff – Energieträger der Zukunft?"}, {"file": "05_Wiederholung.html", "title": "Wiederholung und Selbsttest"}]}, {"id": "9-Atombau", "grade": 9, "title": "Atombau und Periodensystem", "lead": "Die Reihe führt von der historischen Entwicklung der Atommodelle über den Bau der Atomhülle und das Periodensystem bis zu den Ionen. Jede Stunde ist eine eigene Präsentation für Beamer oder Smartboard, mit Simulationen, Hefteintrag und Übungen zum Selbstkontrollieren.", "lessons": [{"file": "01_Atommodelle.html", "title": "Atommodelle im Wandel"}, {"file": "02_Atombau.html", "title": "Kern und Hülle in Zahlen"}, {"file": "03_Schalenmodell.html", "title": "Energiestufen und Schalen"}, {"file": "04_Periodensystem.html", "title": "Ordnung im Periodensystem"}, {"file": "05_Elementfamilien.html", "title": "Elementfamilien"}, {"file": "06_Ionen.html", "title": "Edelgasregel und Ionen"}, {"file": "07_Wiederholung.html", "title": "Wiederholung und Selbsttest"}]}, {"id": "9-Molekuele", "grade": 9, "title": "Moleküle und Elektronenpaarbindung", "lead": "Warum ist Wasser ein Molekül und Kochsalz nicht? Die Reihe erklärt die Elektronenpaarbindung, übt Lewis-Formeln, leitet mit dem Elektronenpaarabstoßungsmodell den räumlichen Bau ab und führt über Elektronegativität und Dipole zu den besonderen Eigenschaften des Wassers.", "lessons": [{"file": "01_Elektronenpaarbindung.html", "title": "Die Elektronenpaarbindung"}, {"file": "02_Lewis.html", "title": "Lewis-Formeln aufstellen"}, {"file": "03_Raeumlicher_Bau.html", "title": "Der räumliche Bau von Molekülen"}, {"file": "04_Polaritaet.html", "title": "Polare Bindungen und Dipolmoleküle"}, {"file": "05_Wasserstoffbruecken.html", "title": "Kräfte zwischen Molekülen"}, {"file": "06_Wiederholung.html", "title": "Wiederholung und Selbsttest"}]}, {"id": "9-Saeuren_Laugen", "grade": 9, "title": "Säuren und Laugen", "lead": "Von Zitronensaft und Abflussreiniger zu Oxonium- und Hydroxid-Ionen: Die Reihe führt Indikatoren und den pH-Wert ein, erklärt saure und alkalische Lösungen auf Teilchenebene, stellt wichtige Säuren und Laugen vor und endet mit Neutralisation und Titration.", "lessons": [{"file": "01_Indikatoren.html", "title": "Saure und alkalische Lösungen"}, {"file": "02_pH_Wert.html", "title": "Der pH-Wert"}, {"file": "03_Saeuren.html", "title": "Säuren und Oxonium-Ionen"}, {"file": "04_Laugen.html", "title": "Laugen und Hydroxid-Ionen"}, {"file": "05_Neutralisation.html", "title": "Neutralisation und Titration"}, {"file": "06_Wiederholung.html", "title": "Wiederholung und Selbsttest"}]}, {"id": "9-Salze", "grade": 9, "title": "Salze und Ionenbindung", "lead": "Aufbauend auf der Reihe Atombau erklärt diese Reihe, warum Salze hohe Schmelztemperaturen haben, spröde sind und als Schmelze oder Lösung Strom leiten. Die Elektronenübertragung führt zur Ionenbindung und zum Ionengitter, Verhältnisformeln und Namen werden geübt, Nachweise und Salze im Alltag schließen die Reihe ab.", "lessons": [{"file": "01_Salzeigenschaften.html", "title": "Salze und ihre Eigenschaften"}, {"file": "02_Ionenbindung.html", "title": "Ionenbindung und Ionengitter"}, {"file": "03_Formeln_Namen.html", "title": "Formeln und Namen von Salzen"}, {"file": "04_Loesen_Elektrolyse.html", "title": "Salze in Wasser und Elektrolyse"}, {"file": "05_Nachweise_Alltag.html", "title": "Ionen nachweisen – Salze im Alltag"}, {"file": "06_Wiederholung.html", "title": "Wiederholung und Selbsttest"}]}, {"id": "10-Alkohole", "grade": 10, "title": "Alkohole", "lead": "Die Reihe schließt an die Kohlenwasserstoffe an: Von der alkoholischen Gärung und der Destillation über die funktionelle Gruppe und die homologe Reihe der Alkanole zu Eigenschaften, mehrwertigen Alkoholen, Oxidation und der Wirkung von Alkohol auf den Körper.", "lessons": [{"file": "01_Ethanol.html", "title": "Ethanol – Gärung und Destillation"}, {"file": "02_Alkanole.html", "title": "Die homologe Reihe der Alkanole"}, {"file": "03_Eigenschaften.html", "title": "Eigenschaften der Alkohole"}, {"file": "04_Oxidation.html", "title": "Oxidation von Alkoholen"}, {"file": "05_Alkohol_Gesundheit.html", "title": "Alkohol – Nutzen und Gefahren"}, {"file": "06_Wiederholung.html", "title": "Wiederholung und Selbsttest"}]}, {"id": "10-Carbonsaeuren_Ester", "grade": 10, "title": "Carbonsäuren und Ester", "lead": "Die Reihe beginnt beim Essig, führt die Carboxygruppe und die homologe Reihe der Alkansäuren ein, vergleicht ihre Säurestärke und Eigenschaften und mündet in Veresterung, Duftstoffe, Fette und Seifen.", "lessons": [{"file": "01_Essigsaeure.html", "title": "Essigsäure"}, {"file": "02_Alkansaeuren.html", "title": "Die homologe Reihe der Alkansäuren"}, {"file": "03_Ester.html", "title": "Ester – Duftstoffe aus Säure und Alkohol"}, {"file": "04_Fette_Seifen.html", "title": "Fette und Seifen"}, {"file": "05_Wiederholung.html", "title": "Wiederholung und Selbsttest"}]}, {"id": "10-Kohlenwasserstoffe", "grade": 10, "title": "Kohlenwasserstoffe", "lead": "Die Reihe führt vom Kohlenstoffatom über die homologe Reihe der Alkane, ihre Eigenschaften, Benennung und Reaktionen zu den ungesättigten Kohlenwasserstoffen und zur Verarbeitung von Erdöl. Jede Stunde ist eine eigene Präsentation für Beamer oder Smartboard, mit 3D-Modellen, Simulationen, Hefteintrag und Übungen zum Selbstkontrollieren.", "lessons": [{"file": "01_Organische_Chemie.html", "title": "Kohlenstoff – Baustein der organischen Chemie"}, {"file": "02_Alkane.html", "title": "Alkane – die homologe Reihe"}, {"file": "03_Eigenschaften.html", "title": "Eigenschaften der Alkane"}, {"file": "04_Nomenklatur.html", "title": "Isomerie und Nomenklatur"}, {"file": "05_Reaktionen.html", "title": "Reaktionen der Alkane"}, {"file": "06_Alkene_Alkine.html", "title": "Alkene und Alkine"}, {"file": "07_Erdoel.html", "title": "Erdöl und Erdgas"}, {"file": "08_Wiederholung.html", "title": "Wiederholung und Selbsttest"}]}, {"id": "10-Kunststoffe", "grade": 10, "title": "Kunststoffe", "lead": "Kunststoffe sind überall. Die Reihe zeigt, wie ihre Eigenschaften vom Bau der Makromoleküle abhängen, wie sie durch Polymerisation und Polykondensation entstehen und welche Wege es für Recycling und nachhaltigere Kunststoffe gibt.", "lessons": [{"file": "01_Kunststoffe_Alltag.html", "title": "Kunststoffe im Alltag"}, {"file": "02_Polymerisation.html", "title": "Polymerisation"}, {"file": "03_Polykondensation.html", "title": "Polykondensation – Polyester und Polyamide"}, {"file": "04_Umwelt_Recycling.html", "title": "Kunststoffe, Umwelt und Recycling"}, {"file": "05_Wiederholung.html", "title": "Wiederholung und Selbsttest"}]}];
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const grades = [...new Set(TOPICS.map(t => t.grade))].sort((a, b) => a - b);

$('grades').innerHTML = grades.map(g => {
  const ts = TOPICS.filter(t => t.grade === g);
  const n = ts.reduce((s, t) => s + t.lessons.length, 0);
  return `<button class="grade" data-g="${g}" type="button">
    <span class="num">${g}</span>
    <span><span class="lbl">Klasse ${g}</span><br><span class="meta">${ts.length} Themen · ${n} Stunden</span></span>
  </button>`;
}).join('');
$('grades').addEventListener('click', e => {
  const b = e.target.closest('.grade'); if (b) location.hash = b.dataset.g;
});
$('topics').addEventListener('click', e => {
  const b = e.target.closest('.topic'); if (b) location.hash = b.dataset.grade + '/' + b.dataset.id;
});
$('crumbs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (b) location.hash = b.dataset.to;
});

function crumbs(parts) {
  $('crumbs').innerHTML = parts.map((p, i) => i === parts.length - 1
    ? `<span aria-current="page">${esc(p.label)}</span>`
    : `<button type="button" data-to="${p.to}">${esc(p.label)}</button><span class="sep">›</span>`).join('');
}

function render() {
  const [gs, id] = decodeURIComponent(location.hash.slice(1)).split('/');
  const g = grades.includes(+gs) ? +gs : null;
  const topic = g && TOPICS.find(t => t.id === id && t.grade === g);
  $('v-grade').hidden = !!g;
  $('v-topic').hidden = !g || !!topic;
  $('v-lessons').hidden = !topic;

  if (!g) {
    $('crumbs').innerHTML = '';
  } else if (!topic) {
    crumbs([{label: 'Start', to: ''}, {label: 'Klasse ' + g}]);
    $('h-topic').textContent = `Klasse ${g} – Thema wählen`;
    $('topics').innerHTML = TOPICS.filter(t => t.grade === g).map(t => `<li>
      <button class="topic" type="button" data-grade="${g}" data-id="${t.id}">
        <span class="t">${esc(t.title)}</span>
        ${t.lead ? `<span class="d">${esc(t.lead)}</span>` : ''}
        <span class="n">${t.lessons.length} Stunden</span>
      </button></li>`).join('');
  } else {
    crumbs([{label: 'Start', to: ''}, {label: 'Klasse ' + g, to: String(g)}, {label: topic.title}]);
    $('h-lessons').textContent = topic.title;
    $('lessons-lead').textContent = topic.lead;
    $('overview-link').href = topic.id + '/00_Uebersicht.html';
    $('lessons').innerHTML = topic.lessons.map((l, i) => `<li class="lesson">
      <a href="${topic.id}/${encodeURI(l.file)}"><span class="no">${String(i + 1).padStart(2, '0')}</span><span class="lt">${esc(l.title)}</span><span class="go" aria-hidden="true">→</span></a>
    </li>`).join('');
  }
  const h = document.querySelector('section:not([hidden]) h2');
  if (h && document.activeElement && document.activeElement !== document.body) { h.tabIndex = -1; h.focus({preventScroll: true}); }
}
addEventListener('hashchange', render);
render();
</script>
</body>
</html>
